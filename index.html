<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WeatherSTAR 4000 - Local on the 8s</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  :root {
    --ws-blue-bg: #000033;
    --ws-panel-bg: rgba(0, 0, 100, 0.9);
    --ws-header-grad: linear-gradient(180deg, #d2a800 0%, #775c00 100%);
    --ws-gold: #ffdd00;
    --ws-white: #ffffff;
    --ws-cyan: #00ffff;
    --ws-border: #3366ff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    font-family: 'VT323', 'Share Tech Mono', monospace;
    color: var(--ws-white);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* iPhone 6s Landscape Canvas Boundary */
  .star4000-frame {
    width: 100vw;
    height: 100vh;
    max-width: 667px;
    max-height: 375px;
    background: linear-gradient(180deg, #000044 0%, #000011 100%);
    border: 2px solid #222;
    display: flex;
    flex-direction: column;
    padding: 6px;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }

  /* Retro Top Banner */
  .ws-header {
    background: var(--ws-header-grad);
    border: 2px solid #ffffff;
    color: #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 10px;
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-shadow: 1px 1px 0px #fff;
    height: 32px;
  }

  /* Primary Grid layout */
  .ws-grid {
    display: grid;
    grid-template-columns: 190px 1fr 160px;
    gap: 6px;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
  }

  .ws-panel {
    background: var(--ws-panel-bg);
    border: 2px solid var(--ws-border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    color: var(--ws-gold);
    font-size: 1.1rem;
    border-bottom: 2px solid var(--ws-gold);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* Current Weather Readouts */
  .temp-display {
    font-size: 2.8rem;
    color: var(--ws-gold);
    line-height: 0.9;
    margin: 2px 0 4px 0;
    text-shadow: 2px 2px 0px #000;
  }

  .cond-display {
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 8px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    margin-bottom: 2px;
    line-height: 1.1;
  }

  .metric-val {
    color: var(--ws-cyan);
  }

  /* Center Screen Radar Container */
  .radar-frame {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000d21;
    border: 1px solid var(--ws-cyan);
    overflow: hidden;
  }

  canvas#ws-radar {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  .radar-overlay {
    position: absolute;
    top: 4px;
    left: 4px;
    color: var(--ws-cyan);
    font-size: 0.85rem;
    background: rgba(0,0,0,0.75);
    padding: 1px 4px;
    border: 1px solid #005577;
  }

  /* Extended Outlook Panel */
  .forecast-item {
    margin-bottom: 6px;
  }

  .forecast-day {
    color: var(--ws-gold);
    font-size: 0.95rem;
  }

  .forecast-desc {
    font-size: 0.85rem;
    line-height: 1.1;
    color: #fff;
  }

  /* Bottom Scrolling Ticker Tape */
  .ws-ticker-container {
    margin-top: 6px;
    background: #000;
    border: 2px solid var(--ws-gold);
    color: var(--ws-gold);
    font-size: 1.1rem;
    height: 28px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .ws-ticker-text {
    white-space: nowrap;
    position: absolute;
    will-change: transform;
  }
</style>
</head>
<body>

<div class="star4000-frame">
  <!-- Top Banner -->
  <div class="ws-header">
    <span id="ws-location-banner">LOCAL FORECAST</span>
    <span id="ws-clock">12:00:00 PM</span>
  </div>

  <!-- Main Telemetry Grid -->
  <div class="ws-grid">
    <!-- Left Panel: Current Weather -->
    <div class="ws-panel">
      <div class="panel-title">CONDITIONS</div>
      <div class="temp-display" id="val-temp">--°F</div>
      <div class="cond-display" id="val-cond">FETCHING...</div>
      
      <div class="metric-row"><span>HUMIDITY:</span><span class="metric-val" id="val-hum">--%</span></div>
      <div class="metric-row"><span>DEWPOINT:</span><span class="metric-val" id="val-dew">--°F</span></div>
      <div class="metric-row"><span>BARO:</span><span class="metric-val" id="val-baro">--.--</span></div>
      <div class="metric-row"><span>WIND:</span><span class="metric-val" id="val-wind">-- --MPH</span></div>
      <div class="metric-row"><span>VISIB:</span><span class="metric-val" id="val-vis">-- MI</span></div>
    </div>

    <!-- Center Panel: WeatherSTAR Radar Sweep -->
    <div class="ws-panel" style="padding: 2px;">
      <div class="radar-frame">
        <div class="radar-overlay" id="radar-status">RADAR LOOP • LOCAL AREA</div>
        <canvas id="ws-radar"></canvas>
      </div>
    </div>

    <!-- Right Panel: 3-Day Extended Outlook -->
    <div class="ws-panel">
      <div class="panel-title">3-DAY OUTLOOK</div>
      <div id="forecast-container">
        <div class="forecast-item">
          <div class="forecast-day">LOADING...</div>
          <div class="forecast-desc">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Ticker -->
  <div class="ws-ticker-container">
    <div class="ws-ticker-text" id="ticker-text">INITIALIZING WEATHERSTAR 4000 TELEMETRY... FETCHING LOCAL OPENWEATHER FEED...</div>
  </div>
</div>

<script>
  /* =========================================================================
     CONFIG - HARDCODED FOR DEDICATED IPHONE 6S DISPLAY
     ========================================================================= */
  const WS_CONFIG = {
    apiKey: "YOUR_OPENWEATHER_API_KEY", // Replace with your OpenWeather API Key
    lat: 39.7817,                       // Your latitude
    lon: -89.6501,                      // Your longitude
    locationName: "SPRINGFIELD",
    units: "imperial",
    refreshMs: 600000                   // 10-minute auto refresh rate
  };

  /* =========================================================================
     CLOCK & TICKER CONTROLLER
     ========================================================================= */
  function updateClock() {
    const now = new Date();
    document.getElementById('ws-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Smooth custom JS ticker to replace deprecated <marquee>
  const tickerTextEl = document.getElementById('ticker-text');
  let tickerPos = window.innerWidth;
  
  function animateTicker() {
    tickerPos -= 1.2;
    if (tickerPos < -tickerTextEl.clientWidth) {
      tickerPos = tickerTextEl.parentElement.clientWidth;
    }
    tickerTextEl.style.transform = `translateX(${tickerPos}px)`;
    requestAnimationFrame(animateTicker);
  }
  animateTicker();

  /* =========================================================================
     WEATHERSTAR API INTEGRATION (OPENWEATHER)
     ========================================================================= */
  async function fetchWeatherData() {
    if (!WS_CONFIG.apiKey || WS_CONFIG.apiKey === "5c2023567ce4ee49c2d715cc37bd75f0") {
      document.getElementById('val-cond').innerText = "NO API KEY";
      document.getElementById('ticker-text').innerText = "PLEASE INSERT A VALID OPENWEATHER API KEY INTO WS_CONFIG IN CODE.";
      return;
    }

    try {
      // 1. Fetch Current Conditions
      const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${WS_CONFIG.lat}&lon=${WS_CONFIG.lon}&units=${WS_CONFIG.units}&appid=${WS_CONFIG.apiKey}`);
      const cur = await curRes.json();

      // 2. Fetch 5-Day / 3-Hour Forecast
      const fcastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${WS_CONFIG.lat}&lon=${WS_CONFIG.lon}&units=${WS_CONFIG.units}&appid=${WS_CONFIG.apiKey}`);
      const fcast = await fcastRes.json();

      // Update UI Header Location
      document.getElementById('ws-location-banner').innerText = `${cur.name.toUpperCase()} FORECAST`;

      // Update Left Panel Readouts
      document.getElementById('val-temp').innerText = `${Math.round(cur.main.temp)}°F`;
      document.getElementById('val-cond').innerText = cur.weather[0].description.toUpperCase();
      document.getElementById('val-hum').innerText = `${cur.main.humidity}%`;
      
      // Calculate Dew Point approximation
      const tempF = cur.main.temp;
      const rh = cur.main.humidity;
      const dewF = Math.round(tempF - ((100 - rh) / 5));
      document.getElementById('val-dew').innerText = `${dewF}°F`;

      // Barometer converting hPa to inHg
      const baroInHg = (cur.main.pressure * 0.02953).toFixed(2);
      document.getElementById('val-baro').innerText = `${baroInHg}IN`;

      // Wind direction vector mapping
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const windDir = dirs[Math.round(cur.wind.deg / 45) % 8];
      document.getElementById('val-wind').innerText = `${windDir} ${Math.round(cur.wind.speed)}MPH`;

      // Visibility converting meters to miles
      const visMiles = Math.round(cur.visibility / 1609.34);
      document.getElementById('val-vis').innerText = `${visMiles} MI`;

      // Update Right Panel Outlook
      const forecastContainer = document.getElementById('forecast-container');
      forecastContainer.innerHTML = '';
      
      // Filter 12:00 PM slices for distinct daily predictions
      const dailySlices = fcast.list.filter(item => item.dt_txt.includes("12:00:00")).slice(0, 3);
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      dailySlices.forEach(slice => {
        const d = new Date(slice.dt * 1000);
        const dayName = days[d.getDay()];
        const desc = slice.weather[0].main.toUpperCase();
        const high = Math.round(slice.main.temp_max);
        const low = Math.round(slice.main.temp_min);

        const item = document.createElement('div');
        item.className = 'forecast-item';
        item.innerHTML = `<div class="forecast-day">${dayName}</div><div class="forecast-desc">${desc} H ${high}° / L ${low}°</div>`;
        forecastContainer.appendChild(item);
      });

      // Update Ticker Text
      const tickerMsg = `LOCAL FORECAST FOR ${cur.name.toUpperCase()}... ` +
                        `CURRENT TEMP ${Math.round(cur.main.temp)}°F... ` +
                        `HUMIDITY ${cur.main.humidity}%... ` +
                        `BAROMETER ${baroInHg} INCHES... ` +
                        `WINDS ${windDir} AT ${Math.round(cur.wind.speed)} MPH... ` +
                        `CONDITIONS: ${cur.weather[0].description.toUpperCase()}...`;
      document.getElementById('ticker-text').innerText = tickerMsg;

    } catch (err) {
      console.error("OpenWeather Fetch Error:", err);
      document.getElementById('ticker-text').innerText = "ERROR UPDATING TELEMETRY FEED... RETRYING AUTOMATICALLY...";
    }
  }

  fetchWeatherData();
  setInterval(fetchWeatherData, WS_CONFIG.refreshMs);

  /* =========================================================================
     CANVAS RETRO RADAR ANIMATION ENGINE
     ========================================================================= */
  const canvas = document.getElementById('ws-radar');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let sweepAngle = 0;
  function renderRadar() {
    ctx.fillStyle = '#000f24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid matrix
    ctx.strokeStyle = '#003366';
    ctx.lineWidth = 1;
    for(let x = 0; x < canvas.width; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for(let y = 0; y < canvas.height; y += 20) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Echo Blob 1 (Green precipitation area)
    ctx.fillStyle = 'rgba(0, 200, 80, 0.45)';
    ctx.beginPath();
    ctx.arc(cx + 25, cy - 15, 30, 0, Math.PI * 2);
    ctx.fill();

    // Echo Blob 2 (Yellow core intensity)
    ctx.fillStyle = 'rgba(230, 230, 0, 0.55)';
    ctx.beginPath();
    ctx.arc(cx + 30, cy - 12, 14, 0, Math.PI * 2);
    ctx.fill();

    // Rotating Radar Line Sweep
    ctx.strokeStyle = '#00ffaa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(sweepAngle) * 180, cy + Math.sin(sweepAngle) * 180);
    ctx.stroke();

    sweepAngle += 0.035;
    requestAnimationFrame(renderRadar);
  }
  renderRadar();
</script>

</body>
</html>
