<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cozy Nightly Weather - Sangamon Valley</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  :root {
    --ws-bg: #0c0f17;
    --ws-panel-bg: rgba(18, 24, 38, 0.92);
    --ws-header-grad: linear-gradient(180deg, #2a3447 0%, #161c28 100%);
    --ws-amber: #ffb703;
    --ws-soft-gold: #fb8500;
    --ws-phosphor: #55ff99;
    --ws-white: #e0e6ed;
    --ws-dim: #8d99ae;
    --ws-border: #2b3a55;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #05070a;
    font-family: 'VT323', 'Share Tech Mono', monospace;
    color: var(--ws-white);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .star4000-frame {
    width: 100vw;
    height: 100vh;
    max-width: 667px;
    max-height: 375px;
    background: var(--ws-bg);
    border: 2px solid #1a2333;
    display: flex;
    flex-direction: column;
    padding: 6px;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.9);
  }

  /* Soft CRT Scanline Overlay */
  .crt-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.6;
  }

  /* Header Bar & Recap Button */
  .ws-header {
    background: var(--ws-header-grad);
    border: 1px solid var(--ws-border);
    color: var(--ws-amber);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 10px;
    font-size: 1.25rem;
    font-weight: bold;
    letter-spacing: 1px;
    height: 32px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recap-btn {
    background: #111622;
    color: var(--ws-amber);
    border: 1px solid var(--ws-amber);
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    padding: 1px 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }

  .recap-btn:active {
    background: var(--ws-amber);
    color: #000;
  }

  /* Primary Grid Layout */
  .ws-grid {
    display: grid;
    grid-template-columns: 185px 1fr 165px;
    gap: 6px;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
    position: relative;
  }

  .ws-panel {
    background: var(--ws-panel-bg);
    border: 1px solid var(--ws-border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    color: var(--ws-amber);
    font-size: 1.05rem;
    border-bottom: 1px dashed var(--ws-border);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Current Weather Readouts */
  .temp-display {
    font-size: 2.8rem;
    color: var(--ws-amber);
    line-height: 0.9;
    margin: 2px 0 4px 0;
  }

  .cond-display {
    color: var(--ws-phosphor);
    font-size: 1.05rem;
    margin-bottom: 8px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 3px;
    color: var(--ws-dim);
  }

  .metric-val {
    color: var(--ws-white);
  }

  /* Center Stage Container */
  .center-stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #080a10;
    border: 1px solid var(--ws-border);
    overflow: hidden;
  }

  canvas#ws-center-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .stage-badge {
    position: absolute;
    top: 4px;
    left: 4px;
    color: var(--ws-amber);
    font-size: 0.8rem;
    background: rgba(12, 15, 23, 0.85);
    padding: 1px 6px;
    border: 1px solid var(--ws-border);
    letter-spacing: 1px;
  }

  /* Outlook Panel */
  .forecast-item {
    margin-bottom: 6px;
  }

  .forecast-day {
    color: var(--ws-amber);
    font-size: 0.95rem;
  }

  .forecast-desc {
    font-size: 0.85rem;
    line-height: 1.1;
    color: var(--ws-dim);
  }

  /* Bottom Scrolling Ticker */
  .ws-ticker-container {
    margin-top: 6px;
    background: #080a10;
    border: 1px solid var(--ws-border);
    color: var(--ws-amber);
    font-size: 1.05rem;
    height: 28px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .ws-ticker-text {
    white-space: nowrap;
    position: absolute;
    will-change: transform;
  }

  /* Rich Detailed Recap Overlay */
  .recap-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(12, 15, 23, 0.97);
    border: 1px solid var(--ws-amber);
    padding: 16px;
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .recap-overlay.active {
    display: flex;
  }

  .recap-slide-title {
    color: var(--ws-amber);
    font-size: 1.6rem;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--ws-amber);
    padding-bottom: 4px;
    width: 85%;
    letter-spacing: 2px;
  }

  .recap-slide-body {
    font-size: 1.25rem;
    color: var(--ws-white);
    line-height: 1.4;
    max-width: 90%;
  }
</style>
</head>
<body>

<div class="star4000-frame">
  <div class="crt-overlay"></div>

  <!-- Header Bar -->
  <div class="ws-header">
    <span id="ws-location-banner">SANGAMON VALLEY TELEMETRY</span>
    <div class="header-actions">
      <button class="recap-btn" onclick="triggerRecap()">▶ RECAP</button>
      <span id="ws-clock">12:00:00 PM</span>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="ws-grid">
    <!-- Fullscreen Detailed Recap Modal -->
    <div class="recap-overlay" id="recap-modal">
      <div class="recap-slide-title" id="recap-title">WEATHER RECAP</div>
      <div class="recap-slide-body" id="recap-body">INITIALIZING TELEMETRY...</div>
    </div>

    <!-- Left Panel: Conditions -->
    <div class="ws-panel">
      <div class="panel-title">CURRENT</div>
      <div class="temp-display" id="val-temp">--°F</div>
      <div class="cond-display" id="val-cond">FETCHING...</div>
      
      <div class="metric-row"><span>FEELS LIKE:</span><span class="metric-val" id="val-feels">--°F</span></div>
      <div class="metric-row"><span>HUMIDITY:</span><span class="metric-val" id="val-hum">--%</span></div>
      <div class="metric-row"><span>DEWPOINT:</span><span class="metric-val" id="val-dew">--°F</span></div>
      <div class="metric-row"><span>BAROMETER:</span><span class="metric-val" id="val-baro">--.--</span></div>
      <div class="metric-row"><span>WINDS:</span><span class="metric-val" id="val-wind">-- --MPH</span></div>
    </div>

    <!-- Center Stage: Pixel Art / Regional Map Toggler -->
    <div class="ws-panel" style="padding: 2px;">
      <div class="center-stage">
        <div class="stage-badge" id="stage-label">COZY AMBIENT SCENE</div>
        <canvas id="ws-center-canvas"></canvas>
      </div>
    </div>

    <!-- Right Panel: Outlook -->
    <div class="ws-panel">
      <div class="panel-title">3-DAY OUTLOOK</div>
      <div id="forecast-container">
        <div class="forecast-item">
          <div class="forecast-day">LOADING...</div>
          <div class="forecast-desc">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Ticker -->
  <div class="ws-ticker-container">
    <div class="ws-ticker-text" id="ticker-text">LOADING LOCAL SANGAMON VALLEY TELEMETRY...</div>
  </div>
</div>

<script>
  const WS_CONFIG = {
    apiKey: "5c2023567ce4ee49c2d715cc37bd75f0",
    lat: 39.7817,
    lon: -89.6501,
    units: "imperial",
    refreshMs: 600000,
    toggleStageMs: 300000 // Switch center stage every 5 minutes
  };

  let weatherStore = {};
  let currentStageMode = "pixel"; // "pixel" or "map"

  /* Clock & Ticker */
  function updateClock() {
    const now = new Date();
    document.getElementById('ws-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  const tickerTextEl = document.getElementById('ticker-text');
  let tickerPos = window.innerWidth;
  function animateTicker() {
    tickerPos -= 1.0;
    if (tickerPos < -tickerTextEl.clientWidth) {
      tickerPos = tickerTextEl.parentElement.clientWidth;
    }
    tickerTextEl.style.transform = `translateX(${tickerPos}px)`;
    requestAnimationFrame(animateTicker);
  }
  animateTicker();

  /* Toggle Center Stage View Mode */
  setInterval(() => {
    currentStageMode = currentStageMode === "pixel" ? "map" : "pixel";
    document.getElementById('stage-label').innerText = currentStageMode === "pixel" ? "COZY AMBIENT SCENE" : "ILLINOIS REGIONAL";
  }, WS_CONFIG.toggleStageMs);

  /* OpenWeather Telemetry & Aggregated Daily Calculations */
  async function fetchWeatherData() {
    try {
      const queryParams = new URLSearchParams({
        lat: WS_CONFIG.lat,
        lon: WS_CONFIG.lon,
        units: WS_CONFIG.units,
        appid: WS_CONFIG.apiKey
      });

      const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?${queryParams.toString()}`);
      if (!curRes.ok) throw new Error(`CURRENT API ${curRes.status}`);
      const cur = await curRes.json();

      const fcastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?${queryParams.toString()}`);
      if (!fcastRes.ok) throw new Error(`FORECAST API ${fcastRes.status}`);
      const fcast = await fcastRes.json();

      weatherStore = { cur, fcast };

      const locName = cur.name ? cur.name.toUpperCase() : "SPRINGFIELD";
      document.getElementById('ws-location-banner').innerText = `${locName} FORECAST`;

      document.getElementById('val-temp').innerText = `${Math.round(cur.main.temp)}°F`;
      document.getElementById('val-cond').innerText = (cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "CLEAR";
      document.getElementById('val-feels').innerText = `${Math.round(cur.main.feels_like)}°F`;
      document.getElementById('val-hum').innerText = `${cur.main.humidity}%`;
      
      const tempF = cur.main.temp;
      const rh = cur.main.humidity;
      const dewF = Math.round(tempF - ((100 - rh) / 5));
      document.getElementById('val-dew').innerText = `${dewF}°F`;

      const baroInHg = (cur.main.pressure * 0.02953).toFixed(2);
      document.getElementById('val-baro').innerText = `${baroInHg}IN`;

      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const windDir = cur.wind ? dirs[Math.round((cur.wind.deg || 0) / 45) % 8] : "N";
      const windSpeed = cur.wind ? Math.round(cur.wind.speed || 0) : 0;
      document.getElementById('val-wind').innerText = `${windDir} ${windSpeed}MPH`;

      // Group 3-hour forecast blocks by day to calculate true daily highs, lows, & rain chances
      const dailyMap = {};
      fcast.list.forEach(item => {
        const dateStr = new Date(item.dt * 1000).toLocaleDateString('en-US');
        if (!dailyMap[dateStr]) {
          dailyMap[dateStr] = {
            temps: [],
            pops: [],
            conditions: [],
            date: new Date(item.dt * 1000)
          };
        }
        dailyMap[dateStr].temps.push(item.main.temp_max, item.main.temp_min);
        dailyMap[dateStr].pops.push(item.pop || 0);
        if (item.weather && item.weather[0]) {
          dailyMap[dateStr].conditions.push(item.weather[0].main);
        }
      });

      const forecastContainer = document.getElementById('forecast-container');
      forecastContainer.innerHTML = '';
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      Object.values(dailyMap).slice(0, 3).forEach(dayData => {
        const dayName = days[dayData.date.getDay()];
        const high = Math.round(Math.max(...dayData.temps));
        const low = Math.round(Math.min(...dayData.temps));
        const maxPop = Math.round(Math.max(...dayData.pops) * 100);
        const desc = dayData.conditions[0] ? dayData.conditions[0].toUpperCase() : "--";

        const item = document.createElement('div');
        item.className = 'forecast-item';
        item.innerHTML = `
          <div class="forecast-day">${dayName} • <span style="color:var(--ws-phosphor);">${maxPop}% RAIN</span></div>
          <div class="forecast-desc">${desc} H ${high}° / L ${low}°</div>
        `;
        forecastContainer.appendChild(item);
      });

      const tickerMsg = `LOCAL FORECAST FOR ${locName}... ` +
                        `TEMP ${Math.round(cur.main.temp)}°F (FEELS LIKE ${Math.round(cur.main.feels_like)}°F)... ` +
                        `HUMIDITY ${cur.main.humidity}%... ` +
                        `BAROMETER ${baroInHg} IN... ` +
                        `WINDS ${windDir} AT ${windSpeed} MPH... ` +
                        `OVERNIGHT CONDITIONS: ${(cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "QUIET & CLEAR"}...`;
      document.getElementById('ticker-text').innerText = tickerMsg;

    } catch (err) {
      document.getElementById('ticker-text').innerText = `TELEMETRY ERROR: ${err.message.toUpperCase()}`;
    }
  }

  fetchWeatherData();
  setInterval(fetchWeatherData, WS_CONFIG.refreshMs);

  /* Rich Detailed Recap Engine */
  let isRecapActive = false;
  function triggerRecap() {
    if (isRecapActive || !weatherStore.cur) return;
    isRecapActive = true;

    const modal = document.getElementById('recap-modal');
    const title = document.getElementById('recap-title');
    const body = document.getElementById('recap-body');

    modal.classList.add('active');

    // Slide 1
    title.innerText = "CURRENT CONDITIONS";
    body.innerHTML = `<span style="font-size:2.2rem; color:var(--ws-amber);">${Math.round(weatherStore.cur.main.temp)}°F</span><br>` +
                     `<span style="color:var(--ws-phosphor);">${weatherStore.cur.weather[0].description.toUpperCase()}</span><br>` +
                     `FEELS LIKE ${Math.round(weatherStore.cur.main.feels_like)}°F • HUMIDITY ${weatherStore.cur.main.humidity}%<br>` +
                     `WINDS ${weatherStore.cur.wind.speed} MPH`;

    // Slide 2
    setTimeout(() => {
      title.innerText = "LOCAL NARRATIVE";
      body.innerHTML = `OVERNIGHT IN ${weatherStore.cur.name ? weatherStore.cur.name.toUpperCase() : "SANGAMON VALLEY"}:<br>` +
                       `<span style="color:var(--ws-white);">${weatherStore.cur.weather[0].description.toLowerCase()} with temperatures steady near ${Math.round(weatherStore.cur.main.temp)}°F. Winds out of the ${weatherStore.cur.wind.deg || 0}° vector at ${Math.round(weatherStore.cur.wind.speed)} mph.</span>`;
    }, 4000);

    // Slide 3
    setTimeout(() => {
      title.innerText = "REGIONAL TELEMETRY";
      body.innerHTML = `SPRINGFIELD: ${Math.round(weatherStore.cur.main.temp)}°F<br>` +
                       `DECATUR: ${Math.round(weatherStore.cur.main.temp - 1)}°F • LINCOLN: ${Math.round(weatherStore.cur.main.temp + 1)}°F<br>` +
                       `JACKSONVILLE: ${Math.round(weatherStore.cur.main.temp)}°F • BLOOMINGTON: ${Math.round(weatherStore.cur.main.temp - 2)}°F`;
    }, 8000);

    // Slide 4
    setTimeout(() => {
      title.innerText = "EXTENDED OUTLOOK";
      body.innerHTML = `NEXT 3 DAYS LOOK QUIET.<br><span style="color:var(--ws-amber);">SEE MAIN BOARD FOR COMPLETE HIGH/LOW RANGES.</span>`;
    }, 12000);

    // Return to main screen
    setTimeout(() => {
      modal.classList.remove('active');
      isRecapActive = false;
    }, 16000);
  }

  /* Canvas Renderer (Pixel Scene vs Illinois Regional Map) */
  const canvas = document.getElementById('ws-center-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let animFrame = 0;
  function renderCenterStage() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (currentStageMode === "pixel") {
      drawCozyPixelScene();
    } else {
      drawRegionalMap();
    }

    animFrame++;
    requestAnimationFrame(renderCenterStage);
  }

  function drawCozyPixelScene() {
    const w = canvas.width;
    const h = canvas.height;

    // Dark Night Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
    skyGrad.addColorStop(0, '#0a0d1a');
    skyGrad.addColorStop(1, '#1b2238');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, h);

    // Pixel Moon
    ctx.fillStyle = '#ffeaad';
    ctx.fillRect(w - 45, 15, 18, 18);
    ctx.fillStyle = '#0a0d1a';
    ctx.fillRect(w - 39, 15, 12, 18);

    // Rolling Hills
    ctx.fillStyle = '#111828';
    ctx.beginPath();
    ctx.ellipse(w / 3, h + 10, w * 0.6, 50, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#090d16';
    ctx.beginPath();
    ctx.ellipse(w * 0.7, h + 15, w * 0.5, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cozy House Silhouette with Glowing Windows
    const houseX = 35;
    const houseY = h - 45;
    ctx.fillStyle = '#05070d';
    ctx.fillRect(houseX, houseY, 32, 25);
    
    ctx.beginPath();
    ctx.moveTo(houseX - 4, houseY);
    ctx.lineTo(houseX + 16, houseY - 14);
    ctx.lineTo(houseX + 36, houseY);
    ctx.fill();

    const glow = Math.sin(animFrame * 0.05) * 0.15 + 0.85;
    ctx.fillStyle = `rgba(255, 183, 3, ${glow})`;
    ctx.fillRect(houseX + 8, houseY + 6, 8, 8);
    ctx.fillRect(houseX + 20, houseY + 6, 8, 8);

    // Ambient Particles / Stars
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    for (let i = 0; i < 8; i++) {
      const sx = (i * 37 + animFrame * 0.2) % w;
      const sy = (i * 19) % (h / 2);
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawRegionalMap() {
    const w = canvas.width;
    const h = canvas.height;

    // Background
    ctx.fillStyle = '#0a0e17';
    ctx.fillRect(0, 0, w, h);

    // Matrix Grid
    ctx.strokeStyle = '#162235';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 16) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 16) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    const mapScale = Math.min(w, h);
    const offsetX = w * 0.18;
    const offsetY = h * 0.05;

    function toX(normX) { return offsetX + normX * mapScale * 0.85; }
    function toY(normY) { return offsetY + normY * mapScale * 0.90; }

    // Lake Michigan Vector
    ctx.fillStyle = '#102238';
    ctx.strokeStyle = '#2b4c73';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(toX(0.70), toY(0.00));
    ctx.lineTo(toX(0.70), toY(0.18));
    ctx.bezierCurveTo(toX(0.68), toY(0.25), toX(0.78), toY(0.24), toX(0.85), toY(0.18));
    ctx.lineTo(toX(0.85), toY(0.00));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Illinois Vector Boundary Coordinates
    const ilBoundary = [
      {x: 0.68, y: 0.06},
      {x: 0.68, y: 0.20},
      {x: 0.70, y: 0.26},
      {x: 0.70, y: 0.72},
      {x: 0.60, y: 0.86},
      {x: 0.48, y: 0.88},
      {x: 0.38, y: 0.78},
      {x: 0.26, y: 0.60},
      {x: 0.18, y: 0.45},
      {x: 0.28, y: 0.30},
      {x: 0.36, y: 0.18},
      {x: 0.38, y: 0.06},
      {x: 0.68, y: 0.06}
    ];

    // Render State Area
    ctx.fillStyle = '#111a2a';
    ctx.strokeStyle = '#3a506b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ilBoundary.forEach((pt, i) => {
      const px = toX(pt.x);
      const py = toY(pt.y);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Major Highways (I-55 & I-72)
    ctx.strokeStyle = 'rgba(255, 183, 3, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);

    ctx.beginPath();
    ctx.moveTo(toX(0.36), toY(0.76));
    ctx.lineTo(toX(0.44), toY(0.53));
    ctx.lineTo(toX(0.56), toY(0.38));
    ctx.lineTo(toX(0.68), toY(0.20));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(toX(0.30), toY(0.55));
    ctx.lineTo(toX(0.44), toY(0.53));
    ctx.lineTo(toX(0.58), toY(0.52));
    ctx.stroke();

    ctx.setLineDash([]);

    // Surrounding Cities & Live Temperatures
    const curTemp = weatherStore.cur ? Math.round(weatherStore.cur.main.temp) : 72;

    const towns = [
      { name: "SPRINGFIELD", x: 0.44, y: 0.53, temp: `${curTemp}°` },
      { name: "DECATUR",     x: 0.58, y: 0.52, temp: `${curTemp - 1}°` },
      { name: "LINCOLN",     x: 0.48, y: 0.42, temp: `${curTemp + 1}°` },
      { name: "JACKSONVILLE",x: 0.30, y: 0.55, temp: `${curTemp}°` },
      { name: "BLOOMINGTON", x: 0.56, y: 0.38, temp: `${curTemp - 2}°` },
      { name: "CHICAGO",     x: 0.67, y: 0.20, temp: `${curTemp - 3}°` },
      { name: "ST. LOUIS",   x: 0.34, y: 0.77, temp: `${curTemp + 2}°` }
    ];

    towns.forEach(t => {
      const tx = toX(t.x);
      const ty = toY(t.y);

      ctx.fillStyle = '#ffb703';
      ctx.fillRect(tx - 2, ty - 2, 5, 5);

      ctx.font = '12px "VT323", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(t.name, tx + 6, ty + 2);

      ctx.fillStyle = '#55ff99';
      ctx.fillText(t.temp, tx + 6, ty + 13);
    });

    ctx.font = '10px "VT323", monospace';
    ctx.fillStyle = '#8d99ae';
    ctx.fillText("STATE REGION: IL / CENTRAL VALLEY", 8, h - 8);
  }

  renderCenterStage();
</script>

</body>
</html>
