<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cozy Nightly Weather - Sangamon Valley</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  :root {
    --ws-bg: #0c0f17;
    --ws-panel-bg: rgba(18, 24, 38, 0.92);
    --ws-header-grad: linear-gradient(180deg, #2a3447 0%, #161c28 100%);
    --ws-amber: #ffb703;
    --ws-soft-gold: #fb8500;
    --ws-phosphor: #55ff99;
    --ws-white: #e0e6ed;
    --ws-dim: #8d99ae;
    --ws-border: #2b3a55;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #05070a;
    font-family: 'VT323', 'Share Tech Mono', monospace;
    color: var(--ws-white);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .star4000-frame {
    width: 100vw;
    height: 100vh;
    max-width: 667px;
    max-height: 375px;
    background: var(--ws-bg);
    border: 2px solid #1a2333;
    display: flex;
    flex-direction: column;
    padding: 6px;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.9);
  }

  /* Soft CRT Scanline Overlay */
  .crt-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.6;
  }

  /* Header Bar & Recap Button */
  .ws-header {
    background: var(--ws-header-grad);
    border: 1px solid var(--ws-border);
    color: var(--ws-amber);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 10px;
    font-size: 1.25rem;
    font-weight: bold;
    letter-spacing: 1px;
    height: 32px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recap-btn {
    background: #111622;
    color: var(--ws-amber);
    border: 1px solid var(--ws-amber);
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    padding: 1px 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }

  .recap-btn:active {
    background: var(--ws-amber);
    color: #000;
  }

  /* Primary Grid Layout */
  .ws-grid {
    display: grid;
    grid-template-columns: 185px 1fr 165px;
    gap: 6px;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
    position: relative;
  }

  .ws-panel {
    background: var(--ws-panel-bg);
    border: 1px solid var(--ws-border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    color: var(--ws-amber);
    font-size: 1.05rem;
    border-bottom: 1px dashed var(--ws-border);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Current Weather Readouts */
  .temp-display {
    font-size: 2.8rem;
    color: var(--ws-amber);
    line-height: 0.9;
    margin: 2px 0 4px 0;
  }

  .cond-display {
    color: var(--ws-phosphor);
    font-size: 1.05rem;
    margin-bottom: 8px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 3px;
    color: var(--ws-dim);
  }

  .metric-val {
    color: var(--ws-white);
  }

  /* Center Stage Container */
  .center-stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #080a10;
    border: 1px solid var(--ws-border);
    overflow: hidden;
  }

  canvas#ws-center-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .stage-badge {
    position: absolute;
    top: 4px;
    left: 4px;
    color: var(--ws-amber);
    font-size: 0.8rem;
    background: rgba(12, 15, 23, 0.85);
    padding: 1px 6px;
    border: 1px solid var(--ws-border);
    letter-spacing: 1px;
  }

  /* Outlook Panel */
  .forecast-item {
    margin-bottom: 6px;
  }

  .forecast-day {
    color: var(--ws-amber);
    font-size: 0.95rem;
  }

  .forecast-desc {
    font-size: 0.85rem;
    line-height: 1.1;
    color: var(--ws-dim);
  }

  /* Bottom Scrolling Ticker */
  .ws-ticker-container {
    margin-top: 6px;
    background: #080a10;
    border: 1px solid var(--ws-border);
    color: var(--ws-amber);
    font-size: 1.05rem;
    height: 28px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .ws-ticker-text {
    white-space: nowrap;
    position: absolute;
    will-change: transform;
  }

  /* Rich Detailed Recap Overlay */
  .recap-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(12, 15, 23, 0.97);
    border: 1px solid var(--ws-amber);
    padding: 16px;
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .recap-overlay.active {
    display: flex;
  }

  .recap-slide-title {
    color: var(--ws-amber);
    font-size: 1.6rem;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--ws-amber);
    padding-bottom: 4px;
    width: 85%;
    letter-spacing: 2px;
  }

  .recap-slide-body {
    font-size: 1.25rem;
    color: var(--ws-white);
    line-height: 1.4;
    max-width: 90%;
  }
</style>
</head>
<body>

<div class="star4000-frame">
  <div class="crt-overlay"></div>

  <!-- Header Bar -->
  <div class="ws-header">
    <span id="ws-location-banner">SANGAMON VALLEY TELEMETRY</span>
    <div class="header-actions">
      <button class="recap-btn" onclick="triggerRecap()">▶ RECAP</button>
      <span id="ws-clock">12:00:00 PM</span>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="ws-grid">
    <!-- Fullscreen Detailed Recap Modal -->
    <div class="recap-overlay" id="recap-modal">
      <div class="recap-slide-title" id="recap-title">WEATHER RECAP</div>
      <div class="recap-slide-body" id="recap-body">INITIALIZING TELEMETRY...</div>
    </div>

    <!-- Left Panel: Conditions -->
    <div class="ws-panel">
      <div class="panel-title">CURRENT</div>
      <div class="temp-display" id="val-temp">--°F</div>
      <div class="cond-display" id="val-cond">FETCHING...</div>
      
      <div class="metric-row"><span>FEELS LIKE:</span><span class="metric-val" id="val-feels">--°F</span></div>
      <div class="metric-row"><span>HUMIDITY:</span><span class="metric-val" id="val-hum">--%</span></div>
      <div class="metric-row"><span>DEWPOINT:</span><span class="metric-val" id="val-dew">--°F</span></div>
      <div class="metric-row"><span>BAROMETER:</span><span class="metric-val" id="val-baro">--.--</span></div>
      <div class="metric-row"><span>WINDS:</span><span class="metric-val" id="val-wind">-- --MPH</span></div>
    </div>

    <!-- Center Stage: Pixel Art / Regional Map Toggler -->
    <div class="ws-panel" style="padding: 2px;">
      <div class="center-stage">
        <div class="stage-badge" id="stage-label">ILLINOIS REGIONAL</div>
        <canvas id="ws-center-canvas"></canvas>
      </div>
    </div>

    <!-- Right Panel: Outlook -->
    <div class="ws-panel">
      <div class="panel-title">3-DAY OUTLOOK</div>
      <div id="forecast-container">
        <div class="forecast-item">
          <div class="forecast-day">LOADING...</div>
          <div class="forecast-desc">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Ticker -->
  <div class="ws-ticker-container">
    <div class="ws-ticker-text" id="ticker-text">LOADING LOCAL SANGAMON VALLEY TELEMETRY...</div>
  </div>
</div>

<script>
  const WS_CONFIG = {
    apiKey: "5c2023567ce4ee49c2d715cc37bd75f0",
    lat: 39.7817,
    lon: -89.6501,
    units: "imperial",
    refreshMs: 600000,
    toggleStageMs: 300000
  };

  let weatherStore = {};
  let currentStageMode = "map"; // Set default to map for layout inspection
  let availableVoices = [];

  function loadVoices() {
    if ('speechSynthesis' in window) {
      availableVoices = window.speechSynthesis.getVoices();
    }
  }
  loadVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  /* Clock & Ticker */
  function updateClock() {
    const now = new Date();
    document.getElementById('ws-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  const tickerTextEl = document.getElementById('ticker-text');
  let tickerPos = window.innerWidth;
  function animateTicker() {
    tickerPos -= 1.0;
    if (tickerPos < -tickerTextEl.clientWidth) {
      tickerPos = tickerTextEl.parentElement.clientWidth;
    }
    tickerTextEl.style.transform = `translateX(${tickerPos}px)`;
    requestAnimationFrame(animateTicker);
  }
  animateTicker();

  /* Toggle Center Stage View Mode */
  setInterval(() => {
    currentStageMode = currentStageMode === "pixel" ? "map" : "pixel";
    document.getElementById('stage-label').innerText = currentStageMode === "pixel" ? "COZY AMBIENT SCENE" : "ILLINOIS REGIONAL";
  }, WS_CONFIG.toggleStageMs);

  /* OpenWeather Telemetry */
  async function fetchWeatherData() {
    try {
      const queryParams = new URLSearchParams({
        lat: WS_CONFIG.lat,
        lon: WS_CONFIG.lon,
        units: WS_CONFIG.units,
        appid: WS_CONFIG.apiKey
      });

      const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?${queryParams.toString()}`);
      if (!curRes.ok) throw new Error(`CURRENT API ${curRes.status}`);
      const cur = await curRes.json();

      const fcastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?${queryParams.toString()}`);
      if (!fcastRes.ok) throw new Error(`FORECAST API ${fcastRes.status}`);
      const fcast = await fcastRes.json();

      weatherStore = { cur, fcast };

      const locName = cur.name ? cur.name.toUpperCase() : "SPRINGFIELD";
      document.getElementById('ws-location-banner').innerText = `${locName} FORECAST`;

      document.getElementById('val-temp').innerText = `${Math.round(cur.main.temp)}°F`;
      document.getElementById('val-cond').innerText = (cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "CLEAR";
      document.getElementById('val-feels').innerText = `${Math.round(cur.main.feels_like)}°F`;
      document.getElementById('val-hum').innerText = `${cur.main.humidity}%`;
      
      const tempF = cur.main.temp;
      const rh = cur.main.humidity;
      const dewF = Math.round(tempF - ((100 - rh) / 5));
      document.getElementById('val-dew').innerText = `${dewF}°F`;

      const baroInHg = (cur.main.pressure * 0.02953).toFixed(2);
      document.getElementById('val-baro').innerText = `${baroInHg}IN`;

      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const windDir = cur.wind ? dirs[Math.round((cur.wind.deg || 0) / 45) % 8] : "N";
      const windSpeed = cur.wind ? Math.round(cur.wind.speed || 0) : 0;
      document.getElementById('val-wind').innerText = `${windDir} ${windSpeed}MPH`;

      const dailyMap = {};
      fcast.list.forEach(item => {
        const dateStr = new Date(item.dt * 1000).toLocaleDateString('en-US');
        if (!dailyMap[dateStr]) {
          dailyMap[dateStr] = {
            temps: [],
            pops: [],
            conditions: [],
            date: new Date(item.dt * 1000)
          };
        }
        dailyMap[dateStr].temps.push(item.main.temp_max, item.main.temp_min);
        dailyMap[dateStr].pops.push(item.pop || 0);
        if (item.weather && item.weather[0]) {
          dailyMap[dateStr].conditions.push(item.weather[0].main);
        }
      });

      const forecastContainer = document.getElementById('forecast-container');
      forecastContainer.innerHTML = '';
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      Object.values(dailyMap).slice(0, 3).forEach(dayData => {
        const dayName = days[dayData.date.getDay()];
        const high = Math.round(Math.max(...dayData.temps));
        const low = Math.round(Math.min(...dayData.temps));
        const maxPop = Math.round(Math.max(...dayData.pops) * 100);
        const desc = dayData.conditions[0] ? dayData.conditions[0].toUpperCase() : "--";

        const item = document.createElement('div');
        item.className = 'forecast-item';
        item.innerHTML = `
          <div class="forecast-day">${dayName} • <span style="color:var(--ws-phosphor);">${maxPop}% RAIN</span></div>
          <div class="forecast-desc">${desc} H ${high}° / L ${low}°</div>
        `;
        forecastContainer.appendChild(item);
      });

      const tickerMsg = `LOCAL FORECAST FOR ${locName}... ` +
                        `TEMP ${Math.round(cur.main.temp)}°F (FEELS LIKE ${Math.round(cur.main.feels_like)}°F)... ` +
                        `HUMIDITY ${cur.main.humidity}%... ` +
                        `BAROMETER ${baroInHg} IN... ` +
                        `WINDS ${windDir} AT ${windSpeed} MPH... ` +
                        `OVERNIGHT CONDITIONS: ${(cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "QUIET & CLEAR"}...`;
      document.getElementById('ticker-text').innerText = tickerMsg;

    } catch (err) {
      document.getElementById('ticker-text').innerText = `TELEMETRY ERROR: ${err.message.toUpperCase()}`;
    }
  }

  fetchWeatherData();
  setInterval(fetchWeatherData, WS_CONFIG.refreshMs);

  /* Dynamic Event-Driven Recap Engine */
  let isRecapActive = false;

  function speakAndFollowUp(text, onComplete) {
    if (!('speechSynthesis' in window)) {
      setTimeout(onComplete, 4000);
      return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    
    utterance.pitch = 0.65;
    utterance.rate = 0.88;

    if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
    const deepVoice = availableVoices.find(v => 
      v.lang.startsWith('en') && (
        v.name.includes('Daniel') || 
        v.name.includes('David') || 
        v.name.includes('Alex') || 
        v.name.includes('Male') || 
        v.name.includes('Natural')
      )
    ) || availableVoices.find(v => v.lang.startsWith('en'));

    if (deepVoice) utterance.voice = deepVoice;

    utterance.onend = () => {
      setTimeout(onComplete, 1500);
    };

    utterance.onerror = () => {
      setTimeout(onComplete, 2000);
    };

    window.speechSynthesis.speak(utterance);
  }

  function triggerRecap() {
    if (isRecapActive || !weatherStore.cur) return;
    isRecapActive = true;

    const modal = document.getElementById('recap-modal');
    const title = document.getElementById('recap-title');
    const body = document.getElementById('recap-body');

    modal.classList.add('active');

    const locName = weatherStore.cur.name ? weatherStore.cur.name : "Sangamon Valley";
    const temp = Math.round(weatherStore.cur.main.temp);
    const cond = weatherStore.cur.weather[0].description;
    const windSpeed = Math.round(weatherStore.cur.wind.speed);

    function runSlide1() {
      title.innerText = "CURRENT CONDITIONS";
      body.innerHTML = `<span style="font-size:2.2rem; color:var(--ws-amber);">${temp}°F</span><br>` +
                       `<span style="color:var(--ws-phosphor);">${cond.toUpperCase()}</span><br>` +
                       `FEELS LIKE ${Math.round(weatherStore.cur.main.feels_like)}°F • HUMIDITY ${weatherStore.cur.main.humidity}%<br>` +
                       `WINDS ${windSpeed} MPH`;
      speakAndFollowUp(
        `Currently in ${locName}, it is ${temp} degrees with ${cond}. Winds are at ${windSpeed} miles per hour.`,
        runSlide2
      );
    }

    function runSlide2() {
      title.innerText = "LOCAL NARRATIVE";
      body.innerHTML = `LOCAL SUMMARY FOR ${locName.toUpperCase()}:<br>` +
                       `<span style="color:var(--ws-white);">${cond} with temperatures near ${temp} degrees. Humidity is running at ${weatherStore.cur.main.humidity} percent.</span>`;
      speakAndFollowUp(
        `Here is your local summary. Expect ${cond} with temperatures holding around ${temp} degrees throughout the area.`,
        runSlide3
      );
    }

    function runSlide3() {
      title.innerText = "REGIONAL TELEMETRY";
      body.innerHTML = `SPRINGFIELD: ${temp}°F<br>` +
                       `DECATUR: ${temp - 1}°F • LINCOLN: ${temp + 1}°F<br>` +
                       `JACKSONVILLE: ${temp}°F • BLOOMINGTON: ${temp - 2}°F`;
      speakAndFollowUp(
        `Looking across central Illinois, Springfield is at ${temp} degrees, Decatur at ${temp - 1}, and Bloomington at ${temp - 2}.`,
        runSlide4
      );
    }

    function runSlide4() {
      title.innerText = "EXTENDED OUTLOOK";
      body.innerHTML = `3-DAY OUTLOOK AVAILABLE ON MAIN DISPLAY.<br><span style="color:var(--ws-amber);">STAY TUNED FOR CONTINUOUS LOCAL TELEMETRY.</span>`;
      speakAndFollowUp(
        `That concludes your Local on the 8s recap. Stay tuned for continuous local telemetry.`,
        finishRecap
      );
    }

    function finishRecap() {
      modal.classList.remove('active');
      isRecapActive = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    runSlide1();
  }

  /* Center Stage Renderer */
  const canvas = document.getElementById('ws-center-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let animFrame = 0;
  function renderCenterStage() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (currentStageMode === "pixel") {
      drawCozyPixelScene();
    } else {
      drawRegionalMap();
    }

    animFrame++;
    requestAnimationFrame(renderCenterStage);
  }

  function drawCozyPixelScene() {
    const w = canvas.width;
    const h = canvas.height;
    const hour = new Date().getHours();
    
    const weatherMain = (weatherStore.cur && weatherStore.cur.weather && weatherStore.cur.weather[0])
      ? weatherStore.cur.weather[0].main.toLowerCase()
      : "clear";

    let skyGrad = ctx.createLinearGradient(0, 0, 0, h);
    let sunX = w * 0.75;
    let sunY = h * 0.3;
    let isNight = false;
    let hillColorNear = '#111828';
    let hillColorFar = '#090d16';

    if (hour >= 5 && hour < 8) {
      skyGrad.addColorStop(0, '#2d1e3e');
      skyGrad.addColorStop(0.5, '#8b4367');
      skyGrad.addColorStop(1, '#ff8e53');
      sunY = h * 0.45;
      hillColorNear = '#23192e';
      hillColorFar = '#150f1d';
    } else if (hour >= 8 && hour < 18) {
      skyGrad.addColorStop(0, '#1b4965');
      skyGrad.addColorStop(0.6, '#62b6cb');
      skyGrad.addColorStop(1, '#bee9e8');
      sunY = h * 0.2;
      hillColorNear = '#1a3a2a';
      hillColorFar = '#0f241a';
    } else if (hour >= 18 && hour < 21) {
      skyGrad.addColorStop(0, '#1a102f');
      skyGrad.addColorStop(0.5, '#721b46');
      skyGrad.addColorStop(1, '#d95d39');
      sunY = h * 0.5;
      hillColorNear = '#1f1024';
      hillColorFar = '#110814';
    } else {
      isNight = true;
      skyGrad.addColorStop(0, '#0a0d1a');
      skyGrad.addColorStop(1, '#1b2238');
      hillColorNear = '#111828';
      hillColorFar = '#090d16';
    }

    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, h);

    if (isNight) {
      ctx.fillStyle = '#ffeaad';
      ctx.fillRect(w - 45, 15, 18, 18);
      ctx.fillStyle = '#0a0d1a';
      ctx.fillRect(w - 39, 15, 12, 18);
    } else {
      ctx.fillStyle = '#fff3b0';
      ctx.fillRect(sunX, sunY, 16, 16);
    }

    if (isNight && !weatherMain.includes('rain') && !weatherMain.includes('cloud')) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      for (let i = 0; i < 10; i++) {
        const sx = (i * 31 + animFrame * 0.1) % w;
        const sy = (i * 17) % (h * 0.5);
        ctx.fillRect(sx, sy, 2, 2);
      }
    }

    ctx.fillStyle = hillColorNear;
    ctx.beginPath();
    ctx.ellipse(w / 3, h + 10, w * 0.6, 50, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hillColorFar;
    ctx.beginPath();
    ctx.ellipse(w * 0.7, h + 15, w * 0.5, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    const houseX = 35;
    const houseY = h - 45;
    ctx.fillStyle = '#05070d';
    ctx.fillRect(houseX, houseY, 32, 25);
    
    ctx.beginPath();
    ctx.moveTo(houseX - 4, houseY);
    ctx.lineTo(houseX + 16, houseY - 14);
    ctx.lineTo(houseX + 36, houseY);
    ctx.fill();

    if (isNight || hour < 8 || hour >= 18 || weatherMain.includes('rain')) {
      const glow = Math.sin(animFrame * 0.05) * 0.15 + 0.85;
      ctx.fillStyle = `rgba(255, 183, 3, ${glow})`;
      ctx.fillRect(houseX + 8, houseY + 6, 8, 8);
      ctx.fillRect(houseX + 20, houseY + 6, 8, 8);
    } else {
      ctx.fillStyle = '#3a4a5b';
      ctx.fillRect(houseX + 8, houseY + 6, 8, 8);
      ctx.fillRect(houseX + 20, houseY + 6, 8, 8);
    }

    if (weatherMain.includes('rain') || weatherMain.includes('drizzle') || weatherMain.includes('thunderstorm')) {
      ctx.fillStyle = 'rgba(160, 210, 255, 0.6)';
      for (let i = 0; i < 25; i++) {
        const rx = (i * 17 + animFrame * 3) % w;
        const ry = (i * 13 + animFrame * 7) % h;
        ctx.fillRect(rx, ry, 1, 6);
      }
    } else if (weatherMain.includes('cloud') || weatherMain.includes('overcast')) {
      ctx.fillStyle = isNight ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.4)';
      const cx1 = (animFrame * 0.3) % (w + 60) - 60;
      ctx.fillRect(cx1, 20, 40, 10);
      ctx.fillRect(cx1 + 10, 15, 20, 5);

      const cx2 = (animFrame * 0.2 + 100) % (w + 80) - 80;
      ctx.fillRect(cx2, 35, 50, 12);
    } else if (weatherMain.includes('fog') || weatherMain.includes('mist')) {
      ctx.fillStyle = 'rgba(200, 220, 240, 0.2)';
      ctx.fillRect(0, h - 30, w, 8);
      ctx.fillRect(0, h - 15, w, 12);
    }
  }

  function drawRegionalMap() {
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = '#0a0e17';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = '#162235';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 16) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 16) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    const mapScale = Math.min(w, h);
    const offsetX = w * 0.18;
    const offsetY = h * 0.05;

    function toX(normX) { return offsetX + normX * mapScale * 0.85; }
    function toY(normY) { return offsetY + normY * mapScale * 0.90; }

    // Lake Michigan
    ctx.fillStyle = '#102238';
    ctx.strokeStyle = '#2b4c73';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(toX(0.70), toY(0.00));
    ctx.lineTo(toX(0.70), toY(0.18));
    ctx.bezierCurveTo(toX(0.68), toY(0.25), toX(0.78), toY(0.24), toX(0.85), toY(0.18));
    ctx.lineTo(toX(0.85), toY(0.00));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Illinois State Outline
    const ilBoundary = [
      {x: 0.68, y: 0.06},
      {x: 0.68, y: 0.20},
      {x: 0.70, y: 0.26},
      {x: 0.70, y: 0.72},
      {x: 0.60, y: 0.86},
      {x: 0.48, y: 0.88},
      {x: 0.38, y: 0.78},
      {x: 0.26, y: 0.60},
      {x: 0.18, y: 0.45},
      {x: 0.28, y: 0.30},
      {x: 0.36, y: 0.18},
      {x: 0.38, y: 0.06},
      {x: 0.68, y: 0.06}
    ];

    ctx.fillStyle = '#111a2a';
    ctx.strokeStyle = '#3a506b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ilBoundary.forEach((pt, i) => {
      const px = toX(pt.x);
      const py = toY(pt.y);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Interstate/Highways (I-55 / I-72)
    ctx.strokeStyle = 'rgba(255, 183, 3, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);

    ctx.beginPath();
    ctx.moveTo(toX(0.36), toY(0.76));
    ctx.lineTo(toX(0.44), toY(0.53));
    ctx.lineTo(toX(0.56), toY(0.38));
    ctx.lineTo(toX(0.68), toY(0.20));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(toX(0.30), toY(0.55));
    ctx.lineTo(toX(0.44), toY(0.53));
    ctx.lineTo(toX(0.58), toY(0.52));
    ctx.stroke();

    ctx.setLineDash([]);

    const curTemp = weatherStore.cur ? Math.round(weatherStore.cur.main.temp) : 79;

    /* City Nodes with Spatial Label Offsets to Prevent Text Collisions */
    const towns = [
      { name: "CHICAGO",      x: 0.67, y: 0.20, temp: `${curTemp - 3}°`, align: "left",  offsetY: 2 },
      { name: "BLOOMINGTON",  x: 0.56, y: 0.38, temp: `${curTemp - 2}°`, align: "left",  offsetY: 2 },
      { name: "LINCOLN",      x: 0.48, y: 0.42, temp: `${curTemp + 1}°`, align: "left",  offsetY: 2 },
      { name: "JACKSONVILLE", x: 0.30, y: 0.55, temp: `${curTemp}°`,     align: "right", offsetY: 2 },
      { name: "SPRINGFIELD",  x: 0.44, y: 0.53, temp: `${curTemp}°`,     align: "center",offsetY: 18 },
      { name: "DECATUR",      x: 0.58, y: 0.52, temp: `${curTemp - 1}°`, align: "left",  offsetY: 2 },
      { name: "ST. LOUIS",    x: 0.34, y: 0.77, temp: `${curTemp + 2}°`, align: "left",  offsetY: 2 }
    ];

    towns.forEach(t => {
      const tx = toX(t.x);
      const ty = toY(t.y);

      // Node Marker
      ctx.fillStyle = '#ffb703';
      ctx.fillRect(tx - 2, ty - 2, 5, 5);

      ctx.font = '11px "VT323", monospace';
      
      let textX = tx + 6;
      let textY = ty + t.offsetY;

      if (t.align === "right") {
        ctx.textAlign = "right";
        textX = tx - 6;
      } else if (t.align === "center") {
        ctx.textAlign = "center";
        textX = tx;
      } else {
        ctx.textAlign = "left";
      }

      // Render City Name
      ctx.fillStyle = '#ffffff';
      ctx.fillText(t.name, textX, textY);

      // Render Temperature Readout directly below name
      ctx.fillStyle = '#55ff99';
      ctx.fillText(t.temp, textX, textY + 11);
    });

    ctx.textAlign = "left";
    ctx.font = '10px "VT323", monospace';
    ctx.fillStyle = '#8d99ae';
    ctx.fillText("STATE REGION: IL / CENTRAL VALLEY", 8, h - 8);
  }

  renderCenterStage();
</script>
