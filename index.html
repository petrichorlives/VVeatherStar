<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WeatherSTAR 4000 - Local on the 8s</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  :root {
    --ws-blue-bg: #000033;
    --ws-panel-bg: rgba(0, 0, 100, 0.9);
    --ws-header-grad: linear-gradient(180deg, #d2a800 0%, #775c00 100%);
    --ws-gold: #ffdd00;
    --ws-white: #ffffff;
    --ws-cyan: #00ffff;
    --ws-border: #3366ff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    font-family: 'VT323', 'Share Tech Mono', monospace;
    color: var(--ws-white);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .star4000-frame {
    width: 100vw;
    height: 100vh;
    max-width: 667px;
    max-height: 375px;
    background: linear-gradient(180deg, #000044 0%, #000011 100%);
    border: 2px solid #222;
    display: flex;
    flex-direction: column;
    padding: 6px;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }

  /* Header Bar & Recap Button */
  .ws-header {
    background: var(--ws-header-grad);
    border: 2px solid #ffffff;
    color: #000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 8px;
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0px #fff;
    height: 34px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .recap-btn {
    background: #000;
    color: var(--ws-gold);
    border: 1px solid #fff;
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    padding: 1px 6px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 1px 1px 0px #000;
  }

  .recap-btn:active {
    background: var(--ws-gold);
    color: #000;
  }

  /* Primary Grid Layout */
  .ws-grid {
    display: grid;
    grid-template-columns: 190px 1fr 160px;
    gap: 6px;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
    position: relative;
  }

  .ws-panel {
    background: var(--ws-panel-bg);
    border: 2px solid var(--ws-border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    color: var(--ws-gold);
    font-size: 1.1rem;
    border-bottom: 2px solid var(--ws-gold);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  /* Current Weather Readouts */
  .temp-display {
    font-size: 2.8rem;
    color: var(--ws-gold);
    line-height: 0.9;
    margin: 2px 0 4px 0;
    text-shadow: 2px 2px 0px #000;
  }

  .cond-display {
    color: #fff;
    font-size: 1.1rem;
    margin-bottom: 8px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    margin-bottom: 2px;
    line-height: 1.1;
  }

  .metric-val {
    color: var(--ws-cyan);
  }

  /* Subtle CRT Radar Display */
  .radar-frame {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000814;
    border: 1px solid var(--ws-border);
    overflow: hidden;
  }

  canvas#ws-radar {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  .radar-overlay {
    position: absolute;
    top: 4px;
    left: 4px;
    color: var(--ws-cyan);
    font-size: 0.8rem;
    background: rgba(0,0,0,0.85);
    padding: 1px 4px;
    border: 1px solid #004466;
  }

  /* Extended Outlook */
  .forecast-item {
    margin-bottom: 6px;
  }

  .forecast-day {
    color: var(--ws-gold);
    font-size: 0.95rem;
  }

  .forecast-desc {
    font-size: 0.85rem;
    line-height: 1.1;
    color: #fff;
  }

  /* Bottom Scrolling Ticker */
  .ws-ticker-container {
    margin-top: 6px;
    background: #000;
    border: 2px solid var(--ws-gold);
    color: var(--ws-gold);
    font-size: 1.1rem;
    height: 28px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .ws-ticker-text {
    white-space: nowrap;
    position: absolute;
    will-change: transform;
  }

  /* Recap Overlay Slide */
  .recap-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--ws-panel-bg);
    border: 2px solid var(--ws-gold);
    padding: 16px;
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .recap-overlay.active {
    display: flex;
  }

  .recap-slide-title {
    color: var(--ws-gold);
    font-size: 1.8rem;
    margin-bottom: 12px;
    border-bottom: 2px solid var(--ws-gold);
    padding-bottom: 4px;
    width: 80%;
  }

  .recap-slide-body {
    font-size: 1.4rem;
    color: #fff;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="star4000-frame">
  <!-- Top Banner -->
  <div class="ws-header">
    <span id="ws-location-banner">LOCAL FORECAST</span>
    <div class="header-actions">
      <button class="recap-btn" onclick="triggerRecap()">▶ RECAP</button>
      <span id="ws-clock">12:00:00 PM</span>
    </div>
  </div>

  <!-- Main Telemetry Grid -->
  <div class="ws-grid">
    <!-- Fullscreen Recap Modal -->
    <div class="recap-overlay" id="recap-modal">
      <div class="recap-slide-title" id="recap-title">WEATHER RECAP</div>
      <div class="recap-slide-body" id="recap-body">INITIALIZING RECAP...</div>
    </div>

    <!-- Left Panel: Conditions -->
    <div class="ws-panel">
      <div class="panel-title">CONDITIONS</div>
      <div class="temp-display" id="val-temp">--°F</div>
      <div class="cond-display" id="val-cond">FETCHING...</div>
      
      <div class="metric-row"><span>HUMIDITY:</span><span class="metric-val" id="val-hum">--%</span></div>
      <div class="metric-row"><span>DEWPOINT:</span><span class="metric-val" id="val-dew">--°F</span></div>
      <div class="metric-row"><span>BARO:</span><span class="metric-val" id="val-baro">--.--</span></div>
      <div class="metric-row"><span>WIND:</span><span class="metric-val" id="val-wind">-- --MPH</span></div>
      <div class="metric-row"><span>VISIB:</span><span class="metric-val" id="val-vis">-- MI</span></div>
    </div>

    <!-- Center Panel: Ambient Radar Sweep -->
    <div class="ws-panel" style="padding: 2px;">
      <div class="radar-frame">
        <div class="radar-overlay">RADAR LOOP</div>
        <canvas id="ws-radar"></canvas>
      </div>
    </div>

    <!-- Right Panel: 3-Day Outlook -->
    <div class="ws-panel">
      <div class="panel-title">3-DAY OUTLOOK</div>
      <div id="forecast-container">
        <div class="forecast-item">
          <div class="forecast-day">LOADING...</div>
          <div class="forecast-desc">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Ticker -->
  <div class="ws-ticker-container">
    <div class="ws-ticker-text" id="ticker-text">INITIALIZING WEATHERSTAR 4000 TELEMETRY...</div>
  </div>
</div>

<script>
  const WS_CONFIG = {
    apiKey: "5c2023567ce4ee49c2d715cc37bd75f0",
    lat: 39.7817,
    lon: -89.6501,
    units: "imperial",
    refreshMs: 600000
  };

  let weatherStore = {};

  function updateClock() {
    const now = new Date();
    document.getElementById('ws-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  const tickerTextEl = document.getElementById('ticker-text');
  let tickerPos = window.innerWidth;
  
  function animateTicker() {
    tickerPos -= 1.1;
    if (tickerPos < -tickerTextEl.clientWidth) {
      tickerPos = tickerTextEl.parentElement.clientWidth;
    }
    tickerTextEl.style.transform = `translateX(${tickerPos}px)`;
    requestAnimationFrame(animateTicker);
  }
  animateTicker();

  async function fetchWeatherData() {
    try {
      const queryParams = new URLSearchParams({
        lat: WS_CONFIG.lat,
        lon: WS_CONFIG.lon,
        units: WS_CONFIG.units,
        appid: WS_CONFIG.apiKey
      });

      const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?${queryParams.toString()}`);
      if (!curRes.ok) throw new Error(`CURRENT API ${curRes.status}`);
      const cur = await curRes.json();

      const fcastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?${queryParams.toString()}`);
      if (!fcastRes.ok) throw new Error(`FORECAST API ${fcastRes.status}`);
      const fcast = await fcastRes.json();

      weatherStore = { cur, fcast };

      const locName = cur.name ? cur.name.toUpperCase() : "SANGAMON";
      document.getElementById('ws-location-banner').innerText = `${locName} FORECAST`;

      document.getElementById('val-temp').innerText = `${Math.round(cur.main.temp)}°F`;
      document.getElementById('val-cond').innerText = (cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "UNKNOWN";
      document.getElementById('val-hum').innerText = `${cur.main.humidity}%`;
      
      const tempF = cur.main.temp;
      const rh = cur.main.humidity;
      const dewF = Math.round(tempF - ((100 - rh) / 5));
      document.getElementById('val-dew').innerText = `${dewF}°F`;

      const baroInHg = (cur.main.pressure * 0.02953).toFixed(2);
      document.getElementById('val-baro').innerText = `${baroInHg}IN`;

      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const windDir = cur.wind ? dirs[Math.round((cur.wind.deg || 0) / 45) % 8] : "N";
      const windSpeed = cur.wind ? Math.round(cur.wind.speed || 0) : 0;
      document.getElementById('val-wind').innerText = `${windDir} ${windSpeed}MPH`;

      const visMiles = cur.visibility ? Math.round(cur.visibility / 1609.34) : "--";
      document.getElementById('val-vis').innerText = `${visMiles} MI`;

      const forecastContainer = document.getElementById('forecast-container');
      forecastContainer.innerHTML = '';
      
      const dailySlices = fcast.list ? fcast.list.filter(item => item.dt_txt && item.dt_txt.includes("12:00:00")).slice(0, 3) : [];
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      dailySlices.forEach(slice => {
        const d = new Date(slice.dt * 1000);
        const dayName = days[d.getDay()];
        const desc = (slice.weather && slice.weather[0]) ? slice.weather[0].main.toUpperCase() : "--";
        const high = Math.round(slice.main.temp_max);
        const low = Math.round(slice.main.temp_min);

        const item = document.createElement('div');
        item.className = 'forecast-item';
        item.innerHTML = `<div class="forecast-day">${dayName}</div><div class="forecast-desc">${desc} H ${high}° / L ${low}°</div>`;
        forecastContainer.appendChild(item);
      });

      const tickerMsg = `LOCAL FORECAST FOR ${locName}... ` +
                        `CURRENT TEMP ${Math.round(cur.main.temp)}°F... ` +
                        `HUMIDITY ${cur.main.humidity}%... ` +
                        `BAROMETER ${baroInHg} INCHES... ` +
                        `WINDS ${windDir} AT ${windSpeed} MPH... ` +
                        `CONDITIONS: ${(cur.weather && cur.weather[0]) ? cur.weather[0].description.toUpperCase() : "CLEAR"}...`;
      document.getElementById('ticker-text').innerText = tickerMsg;

    } catch (err) {
      document.getElementById('ticker-text').innerText = `TELEMETRY ERROR: ${err.message.toUpperCase()}`;
    }
  }

  fetchWeatherData();
  setInterval(fetchWeatherData, WS_CONFIG.refreshMs);

  /* Interactive Timed Recap */
  let isRecapActive = false;
  function triggerRecap() {
    if (isRecapActive || !weatherStore.cur) return;
    isRecapActive = true;

    const modal = document.getElementById('recap-modal');
    const title = document.getElementById('recap-title');
    const body = document.getElementById('recap-body');

    modal.classList.add('active');

    // Slide 1: Current
    title.innerText = "CURRENT CONDITIONS";
    body.innerHTML = `${Math.round(weatherStore.cur.main.temp)}°F<br><span style="color: var(--ws-cyan);">${weatherStore.cur.weather[0].description.toUpperCase()}</span><br>WINDS ${weatherStore.cur.wind.speed} MPH`;

    // Slide 2: Radar Summary
    setTimeout(() => {
      title.innerText = "REGIONAL RADAR";
      body.innerHTML = `PRECIPITATION: NONE DETECTED<br><span style="color: var(--ws-cyan);">SWEEP CLEAR OVER LOCAL SANGAMON AREA</span>`;
    }, 4000);

    // Slide 3: Extended
    setTimeout(() => {
      title.innerText = "EXTENDED OUTLOOK";
      body.innerHTML = `NEXT 3 DAYS<br><span style="color: var(--ws-gold);">CHECK FULL GRID FOR DAILY HIGHS & LOWS</span>`;
    }, 8000);

    // Return to main layout
    setTimeout(() => {
      modal.classList.remove('active');
      isRecapActive = false;
    }, 12000);
  }

  /* Slow CRT Radar Animation */
  const canvas = document.getElementById('ws-radar');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let sweepAngle = 0;
  function renderRadar() {
    // Soft trailing fade effect
    ctx.fillStyle = 'rgba(0, 10, 25, 0.12)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Grid lines
    ctx.strokeStyle = 'rgba(0, 60, 120, 0.25)';
    ctx.lineWidth = 1;
    for(let x = 0; x < canvas.width; x += 15) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for(let y = 0; y < canvas.height; y += 15) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Static ambient echo targets
    ctx.fillStyle = 'rgba(0, 180, 70, 0.25)';
    ctx.beginPath(); ctx.arc(cx + 18, cy - 10, 18, 0, Math.PI * 2); ctx.fill();

    // Slow sweep beam
    ctx.strokeStyle = 'rgba(0, 255, 170, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(sweepAngle) * 120, cy + Math.sin(sweepAngle) * 120);
    ctx.stroke();

    sweepAngle += 0.012; // Slow, relaxed sweep pace
    requestAnimationFrame(renderRadar);
  }
  renderRadar();
</script>

</body>
</html>
